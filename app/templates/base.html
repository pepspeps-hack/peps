<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}E-commerce Site{% endblock %}</title>
    <!-- We can link CSS files here later -->
    <!-- <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"> -->
</head>
<body>
    <header>
        <nav>
            <a href="{{ url_for('index') }}">Home</a>
            <!-- Add more navigation links here: Products, Cart, Login/Register -->
        </nav>
    </header>
    <main>
        {% block content %}
        <!-- Page specific content will go here -->
        {% endblock %}
    </main>
    <footer>
        <p>&copy; 2024 My E-commerce Site</p>
    </footer>
    <!-- We can link JavaScript files here later -->
    <!-- <script src="{{ url_for('static', filename='js/script.js') }}"></script> -->
</body>
</html>
